<html lang="en">
<head>
    <meta charset="utf-8">

    <style>

            clear: both;

<body>

    <!-- Define Icons -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
        <symbol id="GitHubIcon" fill="currentColor" viewBox="0 0 16 16" class="bi bi-github">

        </symbol>

    <!-- <header><strong>Where is the Sun</strong> &mdash; Click anywhere on the map</header> -->
    <header>
        <strong>Where is the Sun</strong>
        <span class="pull-right">
            <a href="https://github.com/sjsafranek/whereisthesun" target="_blank" class="nav-link p-2" title="GitHub">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-github" viewBox="0 0 16 16">
                    <use xlink:href="#GitHubIcon"/>
                </svg>
            </a>
        </span>

    <div id="map"></div>

    <!-- <script src="{{ url_for('static', filename='js/api.js') }}"></script> -->
    <!-- <script src="{{ url_for('static', filename='js/icons.js') }}"></script> -->
    <!-- <script src="{{ url_for('static', filename='js/app.js') }}"></script> -->
    <!-- <script src="{{ url_for('static', filename='js/loading-overlay.js') }}"></script> -->
    <script>

        function buildBaseLayers() {
            // Configure map layers
            // https://github.com/alexurquhart/free-tiles/blob/master/tiles.json
            // https://leaflet-extras.github.io/leaflet-providers/preview/
            var OSM = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            });

            // Setup MapBox layers
            //const MAPBOX_ACCESS_TOKEN = 'pk.eyJ1Ijoic2pzYWZyYW5layIsImEiOiJTUlpwUkV3In0.bq_MxcpnEk6NWKEv4hiP6g';
            // e.g., streets-v12, outdoors-v12, light-v11, dark-v11, satellite-v9

            // var Mapbox_Streets = L.tileLayer(`https://api.mapbox.com/styles/v1/mapbox/streets-v12/tiles/512/{z}/{x}/{y}@2x?access_token=${MAPBOX_ACCESS_TOKEN}`, {
            var Mapbox_Streets = L.tileLayer('https://tiles.thestefanproblem.rocks/api/v1/provider/mapbox_streets/{z}/{x}/{y}.png', {
                tileSize: 512,
                zoomOffset: -1,
                maxZoom: 22,
                attribution:
                    '© <a href="https://www.mapbox.com/about/maps/">Mapbox</a> ' +
                    '© <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
                }
            );

            // var Mapbox_Dark = L.tileLayer(`https://api.mapbox.com/styles/v1/mapbox/dark-v11/tiles/512/{z}/{x}/{y}@2x?access_token=${MAPBOX_ACCESS_TOKEN}`, {
            var Mapbox_Dark = L.tileLayer('https://tiles.thestefanproblem.rocks/api/v1/provider/mapbox_dark/{z}/{x}/{y}.png', {
                tileSize: 512,
                zoomOffset: -1,
                maxZoom: 22,
                attribution:
                    '© <a href="https://www.mapbox.com/about/maps/">Mapbox</a> ' +
                    '© <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
                }
            );

            const baselayers = {
                'OSM': OSM,
                'Streets': Mapbox_Streets,
                'Dark': Mapbox_Dark
            };

            return baselayers;
        }


        var init = function(container_id) {
            
            const loader = new LoadingOverlay();

            const app = new App(container_id, {
                onSearchStart: function() {
                    loader.show();
                },
                onSearchEnd: function() {
                    loader.hide();
                }
            });

            // Setup layer control
            const baselayers = buildBaseLayers();
            const overlays = {};
            var layerControl = L.control.layers(baselayers, overlays)
            layerControl.addTo(app.map);

            // Set baselayer based on time of day
            let hour_of_the_day = new Date().getHours();
            (hour_of_the_day > 8 && hour_of_the_day < 18) ? 
                baselayers.Streets.addTo(app.map) : baselayers.Dark.addTo(app.map);

            window.WhereIsTheSun = app;

        }

        document.addEventListener("DOMContentLoaded", () => {
            init('map');
        });

    </script>
</body>
</html>
