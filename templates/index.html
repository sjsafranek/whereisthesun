<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Where is the Sun?</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">

    <!-- Load Leaflet from CDN -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <!-- Load Esri Leaflet from CDN -->
<!--     <script src="https://unpkg.com/esri-leaflet@3.0.19/dist/esri-leaflet.js"></script>
    <script src="https://unpkg.com/esri-leaflet-vector@4.3.2/dist/esri-leaflet-vector.js"></script> -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&display=swap" rel="stylesheet">

    <style>

        html, body { 
            height: 100%; 
            margin: 0; 
            font-family: "Comic Relief", system-ui;
            font-weight: 700;
            font-style: normal;
        }

        header { 
            padding: 12px 16px; 
            background: gold;
            color: black;
        }

        #map { 
            height: calc(100% - 48px); 
        }


        /* 1. Core Pulsing Marker Styles */
        .gps-marker {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The solid inner blue dot */
        .gps-dot {
            width: 14px;
            height: 14px;
            background-color: #007bff;
            border: 2.5px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
            position: absolute;
            z-index: 2;
        }

        /* The pulsing outer aura */
        .gps-pulse {
            width: 35px;
            height: 35px;
            background-color: rgba(0, 123, 255, 0.4);
            border-radius: 50%;
            position: absolute;
            z-index: 1;
            animation: pulse 2s ease-out infinite;
        }

        /* Pulse animation */
        @keyframes pulse {
            0% {
                transform: scale(0.3);
                opacity: 1;
            }
            100% {
                transform: scale(1.2);
                opacity: 0;
            }
        }

        /* Utilities */
        .pull-right {
            float: right;
        }

        .clearfix::after {
            content: "";
            display: table; /* Or display: block */
            clear: both;
        }


        /* Loading Spinner Overlay */
/* 1. Full-screen overlay background */
.loading-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-color: rgba(0, 0, 0, 0.6); /* Semi-transparent black background */
  z-index: 9999; /* Ensures it sits on top of everything else */
  display: flex;
  justify-content: center;
  align-items: center;
  
  /* Smooth fade transitions */
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.3s ease, visibility 0.3s ease;
}

/* Class to dynamically trigger visibility */
.loading-overlay.active {
  opacity: 1;
  visibility: visible;
}

/* 2. The Spinner Loader (Pure CSS) */
.spinner {
  width: 60px;
  height: 60px;
  border: 6px solid #f3f3f3; /* Light grey base ring */
  border-top: 6px solid #3498db; /* Blue accent spinning color */
  border-radius: 50%; /* Makes it a circle */
  animation: spin 1s linear infinite; /* Smooth continuous rotation */
}

/* Rotation keyframes */
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}


    </style>
</head>
<body>

    <!-- Define Icons -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
        <symbol id="GitHubIcon" fill="currentColor" viewBox="0 0 16 16" class="bi bi-github">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/>
        </symbol>
    </svg>

    <!-- <header><strong>Where is the Sun</strong> &mdash; Click anywhere on the map</header> -->
    <header>
        <strong>Where is the Sun</strong>
        <span class="pull-right">
            <a href="https://github.com/sjsafranek/whereisthesun" target="_blank" class="nav-link p-2" title="GitHub">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-github" viewBox="0 0 16 16">
                    <use xlink:href="#GitHubIcon"/>
                </svg>
            </a>
        </span>
    </header>


    <div id="loading-overlay" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <div id="map"></div>

    <script>


        /**
         * Loading Spinner Overlay
         */
        const loader = {
            element: document.getElementById('loading-overlay'),
          
            show() {
                this.element.classList.add('active');
                document.body.style.overflow = 'hidden'; // Optional: Locks scrolling while active
            },
          
            hide() {
                this.element.classList.remove('active');
                document.body.style.overflow = ''; // Restores window scrolling
            }
        };


        class ApiClient {
            /**
             * @param {string} baseUrl - The base URL for the API (e.g., 'https://example.com')
             * @param {Object} [config={}] - Optional configuration defaults
             */
            constructor(baseUrl, config = {}) {
                this.baseUrl = baseUrl.replace(/\/$/, '');
                this.defaultHeaders = config.headers || {
                  'Content-Type': 'application/json',
                  'Accept': 'application/json'
                };
                this.authToken = config.authToken || null;
            }

            generateUniqueId() {
                return Date.now().toString(36) + Math.random().toString(36).slice(2);
            }

            buildApiRequest(latlng, options) {
                options = options || {}
                return {
                    method: 'FindTheSun',
                    params: {
                        latitude: latlng.lat,
                        longitude: latlng.lng,
                        min_population: options.min_population,
                        max_cloud_cover: options.max_cloud_cover,
                        limit: options.limit
                    },
                    id: this.generateUniqueId()
                };
            }

            findTheSun(latlng, options) {
                let payload = this.buildApiRequest(latlng, options);
                return fetch(`${this.baseUrl}/api/v1`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    })
                    .then(response => response.json())
                    .then(response => {
                        if ('ok' == response.status)
                            return response.data.cities;
                        throw new Error(response.error.message);
                    });
            }
        }


        const Icons = {
            // Define a custom sun divIcon
            sun: L.divIcon({
                className: 'custom-sun-icon',
                html: '<div style="font-size: 24px; color: gold; text-shadow: 0 0 3px rgba(0,0,0,0.5);">☀️</div>',
                iconSize: [30, 30],
                iconAnchor: [15, 15],
                popupAnchor: [0, -15]
            }),

            // Define the Custom DivIcon
            gps: L.divIcon({
                className: 'gps-marker', // Remove default wrapper styling
                html: '<div class="gps-pulse"></div><div class="gps-dot"></div>',
                iconSize: [35, 35],      // Container bounds
                iconAnchor: [17.5, 17.5] // Center the anchor exactly
            })
        }

        const HELSINKI = [60.1708, 24.9375];


        function buildBaseLayers() {
            // Configure map layers
            // https://github.com/alexurquhart/free-tiles/blob/master/tiles.json
            // https://leaflet-extras.github.io/leaflet-providers/preview/
            var OSM = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            });

            // Setup MapBox layers
            //const MAPBOX_ACCESS_TOKEN = 'pk.eyJ1Ijoic2pzYWZyYW5layIsImEiOiJTUlpwUkV3In0.bq_MxcpnEk6NWKEv4hiP6g';
            // e.g., streets-v12, outdoors-v12, light-v11, dark-v11, satellite-v9

            // var Mapbox_Streets = L.tileLayer(`https://api.mapbox.com/styles/v1/mapbox/streets-v12/tiles/512/{z}/{x}/{y}@2x?access_token=${MAPBOX_ACCESS_TOKEN}`, {
            var Mapbox_Streets = L.tileLayer('https://tiles.thestefanproblem.rocks/api/v1/provider/mapbox_streets/{z}/{x}/{y}.png', {
                tileSize: 512,
                zoomOffset: -1,
                maxZoom: 22,
                attribution:
                    '© <a href="https://www.mapbox.com/about/maps/">Mapbox</a> ' +
                    '© <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
                }
            );

            // var Mapbox_Dark = L.tileLayer(`https://api.mapbox.com/styles/v1/mapbox/dark-v11/tiles/512/{z}/{x}/{y}@2x?access_token=${MAPBOX_ACCESS_TOKEN}`, {
            var Mapbox_Dark = L.tileLayer('https://tiles.thestefanproblem.rocks/api/v1/provider/mapbox_dark/{z}/{x}/{y}.png', {
                tileSize: 512,
                zoomOffset: -1,
                maxZoom: 22,
                attribution:
                    '© <a href="https://www.mapbox.com/about/maps/">Mapbox</a> ' +
                    '© <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
                }
            );

            const baselayers = {
                'OSM': OSM,
                'Streets': Mapbox_Streets,
                'Dark': Mapbox_Dark
            };

            return baselayers;
        }


        /**
         * Search Options Control
         */
        L.Control.SearchOptionsControl = L.Control.extend({
            options: {
                position: 'bottomright'
            },

            initialize: function(options) {
                L.Util.setOptions(this, options);
            },

            onAdd: function(map) {
                let self = this;

                // 1. Create a container DOM element
                var container = L.DomUtil.create('div', 'leaflet-bar leaflet-control leaflet-control-custom');
                container.style.backgroundColor = 'white';
                container.style.padding = '8px';
                container.style.cursor = 'pointer';

                // 2. Add HTML filter elements (e.g., a dropdown or button)
                container.innerHTML = `
                    <div style="padding: 2px 4px">
                        <label for="number-of-cities"><strong>Number of cities:</strong></label>
                        <select id="number-of-cities" class="search-options-select">
                            <option value="1" selected>1</option>
                            <option value="5">5</option>
                            <option value="10">10</option>
                        </select>
                    </div>
                    <div style="padding: 2px 4px">
                        <label for="min-population"><strong>Min Population</strong></label>
                        <select id="min-population" class="search-options-select">
                            <option value="25000">25,000</option>
                            <option value="50000" selected>50,000</option>
                            <option value="75000">75,000</option>
                        </select>
                    </div>
                    <div style="padding: 2px 4px">
                        <label for="max-cloud-cover"><strong>Max clound cover</strong></label>
                        <select id="max-cloud-cover" class="search-options-select">
                            <option value="10">10%</option>
                            <option value="20">20%</option>
                            <option value="30" selected>30%</option>
                            <option value="40">40%</option>
                            <option value="50">50%</option>
                        </select>
                    </div>                    
                `;

                // 3. Prevent map click events from firing when interacting with the control
                L.DomEvent.disableClickPropagation(container);

                // 4. Add event listener for filtering data
                container.querySelectorAll('.search-options-select').forEach(function(element) {
                    L.DomEvent.on(element, 'change', function(e) {
                        self.options.onSearchOptionsChange({
                            limit: parseInt(container.querySelector('#number-of-cities').value),
                            min_population: parseInt(container.querySelector('#min-population').value),
                            max_cloud_cover: parseInt(container.querySelector('#max-cloud-cover').value)
                        }); 
                    });
                });

                return container;
            },

            onRemove: function(map) {
                // Clean up event listeners if necessary to prevent memory leaks
            }
        });

        // Factory function
        L.control.searchOptionsControl = function(opts) {
            return new L.Control.SearchOptionsControl(opts);
        };


        /**
         * App
         */
        class App {
            constructor(container_id) {
                let self = this;

                this.api = new ApiClient("/");

                this.map = L.map(container_id, {
                    center: HELSINKI,
                    zoom: 9,
                });

                this._layers = {
                    'sunnyCities':  L.featureGroup(),
                    'userMarker': L.marker(HELSINKI, { icon: Icons.gps }),
                    'userAccuracy': L.circle(HELSINKI, {
                        color: '#007bff',
                        fillColor: '#007bff',
                        fillOpacity: 0.15,
                        weight: 1
                    })
                };
                this._layers.userLocationFeatureGroup = L.featureGroup([this._layers.userMarker, this._layers.userAccuracy]);

                this._layers.sunnyCities.addTo(this.map);

                this.search_options = {
                    min_population: 50000,
                    max_cloud_cover: 30,
                    limit: 1
                };

                L.control.searchOptionsControl({
                    onSearchOptionsChange: function(search_options) {
                        self.search_options = search_options;
                        self.getUserLocation();
                    }
                }).addTo(this.map);

                this.map.on('locationfound', (event) => self._onLocationFound(event) )
                        .on('locationerror', console.log);
            
                this.getUserLocation(true);
            }

            _onLocationFound(event) {
                let self = this;
                this.setUserLocation(event.latlng, event.accuracy);
                this.findSunnyCities(event.latlng);
            }

            findSunnyCities(latlng) {
                let self = this;
                loader.show();
                this.api.findTheSun(latlng, this.search_options)
                    .then((cities) => self.setSunnyCities(cities))
                    .then(() => self.setMapBounds())
                    .catch((error) => {
                        console.error("Caught an error:", error.message);
                    })
                    .finally(() => {
                        loader.hide();
                    });
            }

            getUserLocation(set_view) {
                // map.locate({setView: true, watch: true});
                this.map.locate({
                    setView: set_view || false,
                    maxZoom: 14
                });           
            }

            setUserLocation(latlng, accuracy) {
                this._layers.userMarker.setLatLng(latlng);
                this._layers.userAccuracy.setLatLng(latlng);
                this._layers.userAccuracy.setRadius(accuracy/2);
                !this.map.hasLayer(this._layers.userLocationFeatureGroup) && 
                    this._layers.userLocationFeatureGroup.addTo(this.map);
            }

            _makeCityMarker(city) {
                return L.marker([city.latitude, city.longitude], { icon: Icons.sun }).bindPopup(city.name);
            }

            setSunnyCities(cities) {
                this._layers.sunnyCities.clearLayers();
                for (let i = 0; i < cities.length; i++) {
                    let city = cities[i];
                    const marker = this._makeCityMarker(city);
                    this._layers.sunnyCities.addLayer(marker);
                }
            }

            setMapBounds() {
                const bounds = L.latLngBounds();
                bounds.extend(this._layers.sunnyCities.getBounds());
                bounds.extend(this._layers.userMarker.getLatLng());
                this.map.fitBounds(bounds, { maxZoom: 14 });
            }
        }


        var init = function(container_id) {
            
            const app = new App(container_id);

            // Setup layer control
            const baselayers = buildBaseLayers();
            const overlays = {};
            var layerControl = L.control.layers(baselayers, overlays)
            layerControl.addTo(app.map);

            // Set baselayer based on time of day
            let hour_of_the_day = new Date().getHours();
            (hour_of_the_day > 8 && hour_of_the_day < 18) ? 
                baselayers.Streets.addTo(app.map) : baselayers.Dark.addTo(app.map);

            window.WhereIsTheSun = app;

        }

        init('map');

    </script>
</body>
</html>
